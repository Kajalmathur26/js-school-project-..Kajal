<!DOCTYPE html>

  <link rel="stylesheet" href="./styles/style.css" />
  <title>Timeline of Computing</title>
</head>

<body>
  <header>

      <figure>

        <figcaption><b>Computing Timeline</b></figcaption>
      </figure>

    <h1>Timeline of Computing</h1>
